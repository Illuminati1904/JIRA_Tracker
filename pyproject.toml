[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-sentinel"
version = "0.1.0"
description = "Scope Change Sentinel accelerator: Jira scope-change analysis with an event-sourced memory layer and Claude."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel = "scope_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scope_sentinel = ["report/*.html", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
